[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#111827"
textColor = "#F8FAFC"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
